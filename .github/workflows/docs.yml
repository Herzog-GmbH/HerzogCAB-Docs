name: Build and Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'homepage/**'
      - 'includes/**'
      - 'hooks/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '_tools/embed_releases.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Schritt 1: Landing-Page (homepage/) als Root des Sites kopieren.
      # Das gibt uns cab.herzog-online.com/ -> Produkt-Uebersichtsseite.
      - name: Stage homepage as site root
        run: |
          mkdir -p _site
          if [ -d homepage ]; then
            cp -r homepage/. _site/
          else
            echo "Hinweis: homepage/ fehlt - es wird nur das Handbuch gebaut."
          fi

      # Schritt 1b: Release-Fallback in die kopierte index.html einbetten.
      # Die Seite holt die Releases im Browser live von der GitHub-API.
      # Schlaegt das fehl - unauthentifiziert erlaubt GitHub nur 60 Abrufe
      # pro Stunde und IP - rendert sie aus EMBEDDED_RELEASES. Diese Liste
      # war frueher von Hand gepflegt und hing vier Versionen hinterher,
      # jetzt entsteht sie bei jedem Build neu. Ist die API nicht erreichbar,
      # bricht der Build ab und der bisherige Stand der Seite bleibt online.
      - name: Embed release fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python _tools/embed_releases.py _site/index.html

      # Schritt 2: mkdocs in _site/handbuch/ bauen.
      # Das gibt uns cab.herzog-online.com/handbuch/ -> Online-Handbuch,
      # Deutsch unter /handbuch/, Englisch unter /handbuch/en/ (i18n-Plugin).
      # --strict bricht auch bei Links auf fehlende Sprungmarken ab
      # (validation.anchors in mkdocs.yml).
      - name: Build documentation
        run: mkdocs build --strict --site-dir ./_site/handbuch

      # Schritt 2a: Sprungmarken der englischen Seiten (*.en.md) muessen genau
      # denen der deutschen Seite entsprechen (F1 und Querverweise springen auf
      # Abschnitte). Prueft jede .en.md gegen ihre deutsche Seite.
      - name: Check English anchors
        run: python _tools/anker.py --alle

      # Schritt 2b: F1-Mapping validieren - jeder Pfad in f1-mapping.json
      # muss auf eine real gebaute Seite zeigen (Drift-Schutz App <-> Handbuch),
      # auf Deutsch und unter en/; ein Anker (#...) muss auf der Seite existieren.
      - name: Validate F1 mapping
        run: |
          python - <<'EOF'
          import json, os, sys
          with open('f1-mapping.json', encoding='utf-8') as f:
              mapping = json.load(f)
          site = os.path.join('_site', 'handbuch')
          errors = []
          for key, value in mapping.items():
              if key.startswith('_') or key == '$comment':
                  continue
              path, _, anchor = value.partition('#')
              for lang in ('', 'en'):
                  base = os.path.join(site, lang) if lang else site
                  target = os.path.join(base, path.strip('/'), 'index.html') if path.strip('/') else os.path.join(base, 'index.html')
                  shown = (lang + '/' if lang else '') + value
                  if not os.path.isfile(target):
                      errors.append(f"  {key} -> {shown} (fehlt: {target})")
                  elif anchor:
                      with open(target, encoding='utf-8') as f:
                          if f'id="{anchor}"' not in f.read():
                              errors.append(f"  {key} -> {shown} (Anker fehlt)")
          if errors:
              print("F1-Mapping zeigt auf nicht existierende Seiten:")
              print("\n".join(errors))
              sys.exit(1)
          print(f"F1-Mapping OK: {sum(1 for k in mapping if not k.startswith('_') and k != '$comment')} Keys validiert (de + en).")
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
