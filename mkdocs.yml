# =============================================================================
# Herzog CAB - Anwenderhandbuch
# MkDocs Konfiguration
# =============================================================================
#
# Lokal bauen:    python -m mkdocs serve -a 127.0.0.1:8800   (mkdocs.exe-Shim ist kaputt)
# Statisch bauen: python -m mkdocs build     -> Ausgabe in ./site/
# Deploy GH:      Wird automatisch via GitHub Actions auf gh-pages gepusht.
#
# Struktur seit 07/2026 (Neuaufbau), erweitert 09/2026 (2.0 + Web-App): 7 Top-Tabs
#   Loslegen | Grundlagen | Desktop-App (= F1-Referenz) | Web-App |
#   Aufgaben & Abläufe | Verwaltung (inkl. Lizenzportal) | Hilfe
# Regeln: How-To verlinkt, Referenz beschreibt. Jedes Feld an genau EINER Stelle.
# Keine Berechnungsformeln (Policy) - Standardsatz siehe STYLEGUIDE.md.
# F1-Zuordnung App-Key -> Seite: f1-mapping.json (kanonisch, Repo-Root).
# Zweisprachig seit 10/2026: Deutsch (Standard, /handbuch/...) und Englisch
# (/handbuch/en/..., Dateien <seite>.en.md) - Plugin i18n, hooks/sprachen.py,
# overrides/main.html; Fachwoerter in TERMINOLOGIE.md.
# =============================================================================

site_name: Herzog CAB - Handbuch
site_description: Anwenderhandbuch für Herzog CAB - die Kalkulations- und Designsoftware für Flechtmaschinen, als Desktop-App und Web-App.
site_author: Herzog GmbH
# Custom Domain aktiv seit 2026-05-26 (cab.herzog-online.com → GitHub Pages).
site_url: https://cab.herzog-online.com/handbuch/

# -----------------------------------------------------------------------------
# Repository (Edit-Buttons in der Doku)
# -----------------------------------------------------------------------------
repo_name: HerzogCAB-Docs
repo_url: https://github.com/herzog-gmbh/HerzogCAB-Docs
edit_uri: edit/main/docs/

# -----------------------------------------------------------------------------
# Copyright im Footer
# -----------------------------------------------------------------------------
copyright: Copyright &copy; Herzog GmbH

# -----------------------------------------------------------------------------
# Link-Pruefung: Ein Link auf eine Sprungmarke, die es auf der Zielseite nicht
# gibt (z. B. englische Ueberschrift ohne deutschen Anker), ist eine Warnung
# und bricht "mkdocs build --strict" ab - in beiden Sprachen.
# -----------------------------------------------------------------------------
validation:
  anchors: warn

# -----------------------------------------------------------------------------
# Material Theme
# -----------------------------------------------------------------------------
theme:
  name: material
  # Sprache des Standard-Builds; das i18n-Plugin setzt je Sprach-Build die
  # passende (lang="en" unter /en/).
  language: de
  # Theme-Erweiterung: englische Seiten suchen im englischen Index (overrides/main.html)
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  features:
    # navigation.instant ist seit der Zweisprachigkeit (10/2026) AUS:
    # mit SPA-Laden zeigt der Sprachumschalter sonst die falsche Navigation.
    - navigation.tracking        # Anker in URL
    # Tabs seit Neuaufbau 07/2026 AN: 7 aufgabenorientierte Einstiege in der
    # Kopfleiste, kuerzere Sidebar je Tab (Brand-CSS stylt .md-tabs).
    - navigation.tabs
    - navigation.indexes         # index.md als Sektions-Startseite
    - navigation.top             # "Nach oben"-Button
    - navigation.footer          # Vor/Zurueck im Footer
    - search.suggest             # Suchvorschlaege
    - search.highlight           # Treffer hervorheben
    - search.share               # Suchergebnis-Link teilen
    - toc.follow                 # Inhaltsverzeichnis folgt beim Scrollen
    - content.action.edit        # Edit-Button
    - content.code.copy          # Code-Block kopieren
    - content.tabs.link          # Tabs sind verlinkt
    - content.tooltips           # Glossar-Tooltips (abbr)
  palette:
    # Hell - Herzog-Brand: Primary #00459a, Accent #ffb800
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dunkles Design einschalten
    # Dunkel
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Helles Design einschalten

# -----------------------------------------------------------------------------
# Eigenes CSS (Herzog-Brand: Farben, Schrift, Header, Cards, Tabellen ...)
# -----------------------------------------------------------------------------
extra_css:
  - assets/css/herzog-brand.css

# -----------------------------------------------------------------------------
# Hooks (zweisprachige Fassung): Tooltips und "Auf dieser Seite" je Sprache,
# Suchindex und 404-Seite je Sprache. Erklaerung im Kopf der Datei.
# -----------------------------------------------------------------------------
hooks:
  - hooks/sprachen.py

# Bei "mkdocs serve" auch Aenderungen ausserhalb von docs/ neu bauen
watch:
  - includes
  - overrides

# -----------------------------------------------------------------------------
# Markdown Extensions
# -----------------------------------------------------------------------------
markdown_extensions:
  # Standard
  - abbr
  - admonition                   # !!! note, !!! warning, ...
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true            # Anker-Links bei Ueberschriften
      title: Auf dieser Seite
  # PyMdown Extensions
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details             # Aufklappbare Bloecke
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys                # ++ctrl+s++ Notation
  - pymdownx.mark
  # Glossar-Tooltips (includes/glossar-tooltips.md bzw. .en.md) haengt seit der
  # englischen Fassung hooks/sprachen.py je Sprache an - nicht mehr auto_append.
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  # Sprache des deutschen Suchindex; den englischen Index (/en/search/, lunr-
  # Sprache en) schreibt hooks/sprachen.py.
  - search:
      lang:
        - de
  # Zweisprachig seit 10/2026 (mkdocs-static-i18n 1.2.3): Deutsch (Standard,
  # /handbuch/) und Englisch (/handbuch/en/).
  # Englische Seite liegt neben der deutschen als <name>.en.md, englisches Bild als
  # <name>.en.png. Fehlt die englische Datei, zeigt die englische Fassung die deutsche
  # (der Build meldet solche Ersatzseiten). Sprungmarken: _tools/anker.py.
  # Navigationstitel: _tools/nav_en.txt -> python _tools/nav_en.py
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      # false: keine Dubletten-Bereinigung des gemeinsamen Index - hooks/sprachen.py
      # teilt ihn ohnehin in einen Index je Sprache (/search/, /en/search/).
      reconfigure_search: false
      languages:
        - locale: de
          default: true
          name: Deutsch
          build: true
